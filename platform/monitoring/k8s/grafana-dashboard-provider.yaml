apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: grafana
          volumeMounts:
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: fraudguard-dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: fraudguard-dashboard
          configMap:
            name: fraudguard-dashboard