apiVersion: batch/v1
kind: Job
metadata:
  name: create-mlflow-bucket
  namespace: mlflow
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 minio minio123; do
                echo "Waiting for MinIO to be ready..."
                sleep 5
              done
              until mc ls local >/dev/null 2>&1; do
                echo "Verifying MinIO alias..."
                sleep 2
              done
              if ! mc ls local/mlflow-artifacts >/dev/null 2>&1; then
                mc mb local/mlflow-artifacts
              else
                echo "Bucket mlflow-artifacts already exists"
              fi